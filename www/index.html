    --border: oklch(1 0 0 / 12%); --input: oklch(1 0 0 / 16%);
    --ink: oklch(0.9 0.03 150); --ink-foreground: oklch(0.2 0.025 162); --paper: oklch(0.23 0.028 162);
    --sidebar: oklch(0.22 0.027 162);
  }

  * { box-sizing: border-box; border-color: var(--border); }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--background); color: var(--foreground);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased; line-height: 1.4;
  }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.01em; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ===== Layout ===== */
  .app { display: flex; min-height: 100dvh; }
  .rail { display: none; width: 80px; flex-shrink: 0; flex-direction: column; align-items: center; gap: 8px;
    padding: 20px 0; border-right: 1px solid var(--border); background: var(--sidebar); }
  .rail img { width: 40px; height: 40px; margin-bottom: 16px; }
  .rail .nav { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
    border-radius: 16px; font-size: 12px; font-weight: 500; background: var(--ink); color: var(--ink-foreground); border: 0; }
  .rail .bell { margin-top: auto; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--background) 90%, transparent);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .brand img { width: 28px; height: 28px; }
  main { flex: 1; padding-bottom: 96px; }
  .wrap { max-width: 672px; margin: 0 auto; padding: 16px 16px 32px; }
  @media (min-width: 768px) {
    .rail { display: flex; } .topbar { display: none; }
    .wrap { padding: 32px 32px 32px; } main { padding-bottom: 0; }
    .fab { bottom: 32px !important; right: 32px !important; }
  }

  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent;
    display: inline-grid; place-items: center; font-size: 20px; color: var(--foreground); }
  .icon-btn:hover { background: var(--muted); }
  .icon-btn.round { border-radius: 999px; background: var(--secondary); font-weight: 600; font-size: 15px; }

  /* ===== Day header ===== */
  .dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dayhead .center { text-align: center; }
  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); min-height: 1.4em; }
  .dayhead h1 { font-size: 26px; font-weight: 600; }
  @media (min-width: 768px) { .dayhead h1 { font-size: 30px; } }
  .progress { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .bar { flex: 1; height: 8px; background: var(--muted); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--success); border-radius: 999px; transition: width .3s; }
  .progress span { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .btn-soft { border: 0; background: var(--secondary); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; }

  .sorts { display: flex; gap: 6px; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; }
  .sorts button { flex-shrink: 0; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500;
    background: var(--card); color: var(--muted-foreground); border: 1px solid var(--border); }
  .sorts button[aria-pressed="true"] { background: var(--ink); color: var(--ink-foreground); border-color: transparent; }


  /* ===== Timeline ===== */
  .timeline { list-style: none; margin: 24px 0 0; padding: 0; }
  .hour { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
  .hour .label { padding-top: 8px; text-align: right; font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--muted-foreground); }
  .hour .label small { font: 500 10px var(--font-sans); margin-left: 2px; }
  .hour.now .label { color: var(--primary); }
  .hour .slot { position: relative; min-height: 48px; border-left: 2px solid var(--border); padding: 0 0 8px 12px; }
  .hour.now .slot { border-color: var(--primary); }
  .hour.now .slot::before { content: ""; position: absolute; left: -7px; top: 12px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--primary); box-shadow: var(--shadow-sun); }
  .add-slot { display: flex; align-items: center; gap: 4px; width: 100%; height: 40px; padding: 0 8px;
    border: 0; border-radius: 12px; background: transparent; font-size: 12px; color: transparent; }
  .add-slot:hover, .add-slot:focus-visible { background: var(--muted); color: var(--muted-foreground); }
  @media (hover: none) { .add-slot { color: color-mix(in oklab, var(--muted-foreground) 35%, transparent); } }
  .stack { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .list { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }

  /* ===== Activity card ===== */
  .card { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 16px;
    background: var(--card); box-shadow: var(--shadow-soft); animation: rise .35s ease-out both; transition: opacity .2s; }
  .card.done { opacity: .6; }
  .card .stripe { position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--cat); }
  .card .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 16px; }
  .check { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 2px 0 0; flex-shrink: 0;
    border: 2px solid var(--input); border-radius: 50%; background: var(--card); display: grid; place-content: center; cursor: pointer; }
  .check:checked { background: var(--success); border-color: var(--success); }
  .check:checked::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .card .body { min-width: 0; flex: 1; text-align: left; border: 0; background: none; padding: 0; }
  .card .time { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .card h3 { font: 600 15px/1.3 var(--font-sans); letter-spacing: 0; margin-top: 1px; word-break: break-word; }
  .card.done h3 { text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--muted-foreground) 60%, transparent); }
  .chips { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; background: color-mix(in oklab, var(--c) 14%, transparent); color: var(--c); }
  .chip.pri-media { color: var(--accent-foreground); background: color-mix(in oklab, var(--priority-media) 18%, transparent); }
  .notes-ic { font-size: 13px; color: var(--muted-foreground); }
  .meter { display: inline-flex; align-items: flex-end; gap: 3px; margin-top: 4px; }
  .meter i { width: 6px; border-radius: 999px; background: var(--border); }
  .meter i.on { background: var(--mc); }
  .shop { border-top: 1px solid var(--border); background: var(--paper); }
  .shop > button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 16px; border: 0; background: none;
    font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .shop > button .chev { margin-left: auto; transition: transform .2s; }
  .shop > button[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .shop ul { list-style: none; margin: 0; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .shop li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .shop li .check { border-radius: 5px; width: 18px; height: 18px; margin: 0; }
  .shop li label.bought { color: var(--muted-foreground); text-decoration: line-through; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .empty { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .empty p { margin: 0; } .empty .t { font: 500 18px var(--font-display); } .empty .s { max-width: 280px; font-size: 14px; color: var(--muted-foreground); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px;
    border-radius: 999px; border: 0; font-weight: 600; font-size: 14px; }
  .btn.ink { background: var(--ink); color: var(--ink-foreground); }
  .btn.sun { background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-sun); height: 44px; }
  .btn.outline { background: var(--card); border: 1px solid var(--input); }
  .fab { position: fixed; z-index: 20; bottom: 96px; right: 20px; width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-sun); font-size: 30px; line-height: 1; display: grid; place-items: center; }

  /* ===== Mobile tab bar ===== */
  .tabbar { position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: 1fr; padding: 6px 24px max(env(safe-area-inset-bottom), 8px);
    border-top: 1px solid var(--border); background: color-mix(in oklab, var(--card) 95%, transparent); backdrop-filter: blur(8px); }
  .tabbar div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 500; color: var(--primary); }
  @media (min-width: 768px) { .tabbar { display: none; } }

  /* ===== Bottom sheet ===== */
  .overlay { position: fixed; inset: 0; z-index: 50; background: oklch(0.2 0.03 162 / 50%); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: 100%; max-width: 512px; max-height: 92dvh; overflow-y: auto; background: var(--background);
    border-radius: 24px 24px 0 0; padding: 20px 20px max(env(safe-area-inset-bottom), 16px); animation: up .25s ease-out both; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { font-size: 20px; } .sheet .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted-foreground); }
  form { margin-top: 16px; display: flex; flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .field > .lbl { font-size: 14px; font-weight: 500; }
  input[type=text], input[type=date], input[type=time], textarea {
    width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--input);
    background: color-mix(in oklab, var(--input) 0%, var(--card)); color: var(--foreground); font: inherit; }
  textarea { height: auto; padding: 10px 12px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .grid2 .span { grid-column: span 2; }
  .timebtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 44px; padding: 0 12px;
    border-radius: 12px; border: 1px solid var(--input); background: var(--card); color: var(--foreground); font: inherit; text-align: left; }
  .timebtn.empty span { color: var(--muted-foreground); }
  .timebtn svg { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: var(--muted-foreground); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .modal.clock { width: min(320px, calc(100vw - 32px)); padding: 16px; }
  .ck-title { margin-bottom: 10px; font-size: 14px; font-weight: 600; }
  .ck-head { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px; border-radius: 16px; background: var(--ink); color: var(--ink-foreground); }
  .ck-time { display: flex; align-items: center; font-size: 44px; font-weight: 700; line-height: 1; }
  .ck-time button { border: 0; background: transparent; color: inherit; font: inherit; padding: 4px 8px; border-radius: 10px; opacity: .6; }
  .ck-time button[aria-pressed="true"], .ck-ampm button[aria-pressed="true"] { opacity: 1; background: color-mix(in oklab, var(--ink-foreground) 18%, transparent); }
  .ck-ampm { display: flex; flex-direction: column; gap: 4px; }
  .ck-ampm button { border: 0; background: transparent; color: inherit; font: 600 14px var(--font-sans); padding: 6px 10px; border-radius: 8px; opacity: .6; }
  .ck-dial { width: min(240px, 100%); aspect-ratio: 1; margin: 16px auto 8px; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 50%; }
  .ck-dial svg { width: 100%; height: 100%; display: block; }
  .ck-bg { fill: var(--muted); } .ck-hand { stroke: var(--primary); stroke-width: 2; } .ck-pivot, .ck-tip { fill: var(--primary); } .ck-dot { fill: var(--primary-foreground); }
  .ck-n { font: 500 17px var(--font-sans); fill: var(--foreground); pointer-events: none; } .ck-n.sel { fill: var(--primary-foreground); font-weight: 700; }
  .ck-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .ck-actions .btn { padding: 0 14px; }
  .interest-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .interest-pick button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font-size: 11px; font-weight: 500; }
  .interest-pick button[aria-checked="true"] { border-color: var(--primary); background: var(--accent); color: var(--accent-foreground); }
  .interest-pick i { width: 12px; height: 12px; border-radius: 50%; background: var(--mc); }
  .pri-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pri-pick button, .cat-pick button { border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font-weight: 500; font-size: 14px; }
  .pri-pick button { border-radius: 12px; padding: 8px 0; }
  .cat-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-pick button { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; }
  .cat-pick i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  [aria-pressed="true"].sel { border-color: transparent !important; font-weight: 600;
    background: color-mix(in oklab, var(--c) 15%, transparent) !important; color: var(--c) !important; }
  .shop-edit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .shop-edit li { display: flex; align-items: center; justify-content: space-between; border-radius: 8px; background: var(--muted); padding: 4px 4px 4px 12px; font-size: 14px; }
  .shop-edit button { border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; font-size: 16px; }
  .addrow { display: flex; gap: 8px; } .addrow input { height: 40px; } .addrow button { width: 40px; flex-shrink: 0; border: 0; border-radius: 999px; background: var(--secondary); font-size: 20px; }
  .error { margin: 0; font-size: 14px; font-weight: 500; color: var(--destructive); }
  .actions { display: flex; gap: 8px; padding-bottom: 8px; } .actions .btn.sun { flex: 1; }
  .del { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--input); background: var(--card); color: var(--destructive); font-size: 18px; }

  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--ink-foreground);
    padding: 10px 16px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow-soft); animation: rise .25s both; }
  .modal { background: var(--card); max-width: 360px; margin: auto 16px; border-radius: 20px; padding: 20px; box-shadow: var(--shadow-soft); }
  .modal p { margin: 8px 0 16px; font-size: 14px; color: var(--muted-foreground); }
  @media (min-width: 520px) { .overlay { align-items: flex-end; } .overlay.center { align-items: center; } .modal { margin: auto; } }
  .icon-btn.bell { position: relative; }
  .icon-btn.bell.on::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 500; }
  .switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--input); position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s; border: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgb(0 0 0 / 25%); }
  .switch:checked { background: var(--success); } .switch:checked::after { transform: translateX(18px); }
  .lead-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .lead-pick button { border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
  .note { margin: 0; font-size: 12px; color: var(--muted-foreground); line-height: 1.5; }
  .note.warn { color: var(--destructive); }
  .alerts { position: fixed; z-index: 80; top: max(env(safe-area-inset-top), 12px); left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .alert { pointer-events: auto; width: 100%; max-width: 420px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px;
    border-radius: 18px; background: var(--ink); color: var(--ink-foreground); box-shadow: var(--shadow-soft); animation: drop .3s ease-out both; border-left: 5px solid var(--primary); }
  .alert .tx { flex: 1; min-width: 0; } .alert b { display: block; font-size: 15px; word-break: break-word; } .alert small { opacity: .8; font-size: 13px; }
  .alert button { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; background: var(--primary); color: var(--primary-foreground); }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  :root {
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: var(--font-sans);
    --background: oklch(0.972 0.008 95);
    --card: oklch(0.995 0.003 95);
    --ink: oklch(0.3 0.05 165);
    --border: oklch(0.9 0.012 95);
    --shadow-soft: 0 1px 2px oklch(0.27 0.045 162 / 5%), 0 10px 24px -14px oklch(0.27 0.045 162 / 22%);
  }
  body { letter-spacing: -0.005em; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { letter-spacing: -0.02em; font-weight: 700; }

  /* Pantalla de carga */
  #splash { position: fixed; inset: 0; z-index: 999; background: #f7f1e6; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash .sp-logo { width: 240px; height: 240px; display: block; animation: pop .8s cubic-bezier(.2,.8,.2,1) both; }
  #splash .sp-adsago { display: block; width: 100px; max-width: 32vw; height: auto; margin: 0 auto; }
  #splash .sp-brand { position: absolute; left: 0; right: 0; bottom: max(env(safe-area-inset-bottom), 32px); text-align: center; color: #1f4a3a; animation: fade .8s .3s both; }
  #splash small { display: block; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .55; margin-bottom: 4px; padding-left: .24em; }
  #splash b { display: block; font-size: 17px; font-weight: 700; letter-spacing: .38em; padding-left: .38em; }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } }

  /* Encabezado del día */
  .hero { position: relative; overflow: hidden; padding: 14px 12px 18px; border-radius: 24px; color: #f6f1e6;
    background: linear-gradient(145deg, oklch(0.35 0.055 165), oklch(0.25 0.045 168)); box-shadow: 0 16px 32px -18px oklch(0.25 0.05 165 / 70%); }
  .hero::after { content: ""; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px; border-radius: 50%;
    background: radial-gradient(circle, oklch(0.64 0.155 45 / 38%), transparent 70%); pointer-events: none; }
  .hero > * { position: relative; z-index: 1; }
  .hero .eyebrow { color: oklch(0.86 0.04 150); }
  .hero h1 { color: #fff; font-size: 24px; }
  .hero .icon-btn { color: #fff; background: rgb(255 255 255 / 10%); }
  .hero .icon-btn:hover { background: rgb(255 255 255 / 18%); }
  .hero .progress { margin: 14px 4px 0; }
  .hero .bar { background: rgb(255 255 255 / 16%); }
  .hero .bar > i { background: var(--primary); }
  .hero .progress span { color: oklch(0.92 0.03 150); }
  .hero .btn-soft { background: rgb(255 255 255 / 16%); color: #fff; }

  /* Orden: control segmentado */
  .sorts { padding: 4px; margin-top: 14px; background: var(--muted); border-radius: 999px; overflow-x: auto; }
  .sorts button { flex: 1; border: 0; background: transparent; padding: 8px 12px; white-space: nowrap; }
  .sorts button[aria-pressed="true"] { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-soft); }

  /* Línea de tiempo */
  .hour .label { font-family: var(--font-sans); font-size: 13px; font-weight: 700; }
  .hour .slot { border-left-width: 2px; }

  /* Tarjetas con sticker */
  .card { border-radius: 18px; }
  .card .stripe { display: none; }
  .card .row { align-items: center; padding: 12px; gap: 12px; }
  .card .check { margin: 0; }
  .card h3 { font-size: 15px; font-weight: 650; }
  .sticker { --s: 46px; width: var(--s); height: var(--s); flex-shrink: 0; display: grid; place-items: center;
    font-size: 24px; line-height: 1; border-radius: 15px; transform: rotate(-6deg); border: 3px solid #fff;
    background: color-mix(in oklab, var(--c) 18%, #fff);
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--c) 28%, transparent), 0 6px 12px -5px color-mix(in oklab, var(--c) 55%, transparent); }
  .card:nth-child(even) .sticker { transform: rotate(5deg); }
  .card.done .sticker { filter: grayscale(.6); }
  .cat-pick button { padding: 6px 12px 6px 8px; }
  .cat-pick i { display: none; }
  .cat-pick .em { font-size: 18px; line-height: 1; }
  .fab { border-radius: 20px; }
  /* Anillo de progreso */
  .hero .progress { gap: 14px; margin-top: 12px; }
  .hero .pcol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .hero .pcol span { align-self: flex-end; font-size: 13px; font-weight: 600; }
  .hero .pcol .bar { flex: none; width: 100%; }
  .ring { position: relative; flex-shrink: 0; width: 58px; height: 58px; display: grid; place-items: center; }
  .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgb(8 22 28 / 32%); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%); }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); fill: none; stroke-width: 4.5; }
  .ring .rt { stroke: rgb(255 255 255 / 25%); }
  .ring .rp { stroke: #ffd96a; stroke-linecap: round; filter: drop-shadow(0 0 4px rgb(255 217 106 / 55%)); animation: ringIn 1s cubic-bezier(.2,.8,.2,1) both; }
  .ring.full .rp { stroke: #7be0a5; filter: drop-shadow(0 0 4px rgb(123 224 165 / 60%)); }
  .ring b { position: relative; font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
  @keyframes ringIn { from { stroke-dasharray: 0 100; } }
  /* Paisaje del encabezado según la hora */
  .hero::after { display: none; }
  .hero[data-sky="morning"]   { background: linear-gradient(165deg, #1d5f7a 0%, #3b93ae 58%, #e9a35f 125%); }
  .hero[data-sky="afternoon"] { background: linear-gradient(165deg, #6e3a5c 0%, #c4573f 58%, #f0944d 125%); }
  .hero[data-sky="night"]     { background: linear-gradient(165deg, #06121e 0%, #11303f 70%, #1b4a52 125%); }
  .hero .dayhead, .hero .progress { z-index: 2; text-shadow: 0 1px 3px rgb(0 0 0 / 30%); }
  .hero > .sky { position: absolute !important; z-index: 0 !important; pointer-events: none; }
  .sky-obj { top: 0; right: 0; height: 100%; aspect-ratio: 160 / 150; overflow: visible; }
  .sky-hills { left: 0; bottom: 0; width: 100%; height: 34px; }
  .hero { padding-bottom: 34px; }
  .sky-stars { inset: 0; width: 100%; height: 100%; animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
  /* Misma organización en todas las pantallas: barra superior con marca, campana y tema */
  .rail { display: none !important; }
  .topbar { display: flex !important; padding-inline: max(16px, calc((100% - 672px) / 2 + 16px)); }
  .icon-btn svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.round { background: var(--muted); }
  .icon-btn.theme-sun, .icon-btn.theme-sun svg { color: var(--primary); }
  .icon-btn.bell { color: var(--ink); }
  .icon-btn.bell.off { color: var(--muted-foreground); }
  .icon-btn.bell.on::after { top: 7px; right: 8px; border: 2px solid var(--background); box-sizing: content-box; width: 7px; height: 7px; }
  /* ajustes de espacio para pantallas angostas */
  .hero h1 { font-size: clamp(16px, 5.2vw, 20px); white-space: nowrap; }
  .hero .center { min-width: 0; }
  .hour { grid-template-columns: 40px 1fr; gap: 6px; }
  .hour .slot { padding-left: 8px; }
  .card .row { gap: 10px; padding: 12px 10px; }
  .sticker { --s: 42px; font-size: 22px; }
  .meter i { width: 5px; }
  .card .time { font-size: 11.5px; }
  .tabbar { border-top-color: var(--border); }
</style>

<script>
"use strict";
/* =========================================================================
   Reglas del planificador (portadas de src/lib/planner-rules.ts)
   ========================================================================= */
const PRIORITIES = ["alta", "media", "baja"];
const CATEGORIES = ["trabajo", "estudio", "salud", "hogar", "ocio", "compras", "personal"];
const CAT_LABEL = { trabajo: "Trabajo", estudio: "Estudio", salud: "Salud", hogar: "Hogar", ocio: "Ocio", compras: "Compras", personal: "Personal" };
const PRI_LABEL = { alta: "Alta", media: "Media", baja: "Baja" };
const INTEREST_LABELS = ["", "Poco", "Algo", "Normal", "Bastante", "Muchísimo"];
const SORTS = [["hora", "Por hora"], ["interes", "Por interés"], ["prioridad", "Por prioridad"]];

const clampInterest = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(5, Math.max(1, n)) : 3; };
const normalizePriority = v => PRIORITIES.includes(String(v ?? "").toLowerCase().trim()) ? String(v).toLowerCase().trim() : "media";
const normalizeCategory = v => { const s = String(v ?? "").toLowerCase().trim().normalize("NFD").replace(/[̀-ͯ]/g, ""); return CATEGORIES.includes(s) ? s : "personal"; };
function normalizeTime(v) {
  if (v == null || v === "") return null;
  const m = String(v).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  if (!m) return null;
  const h = +m[1], min = +m[2];
  return h > 23 || min > 59 ? null : `${String(h).padStart(2, "0")}:${String(min).padStart(2, "0")}`;
}
const timeToMinutes = t => { const [h = 0, m = 0] = t.split(":").map(Number); return h * 60 + m; };
function validateTimeRange(start, end) {
  if (!normalizeTime(start)) return "La hora de inicio no es válida.";
  if (end == null) return null;
  if (!normalizeTime(end)) return "La hora de fin no es válida.";
  if (timeToMinutes(normalizeTime(end)) <= timeToMinutes(normalizeTime(start))) return "La hora de fin debe ser después de la hora de inicio.";
  return null;
}
const PW = { alta: 3, media: 2, baja: 1 };
function sortActivities(items, mode) {
  const byTime = (a, b) => a.start_time.localeCompare(b.start_time);
  const c = [...items];
  if (mode === "interes") return c.sort((a, b) => b.interest - a.interest || byTime(a, b));
  if (mode === "prioridad") return c.sort((a, b) => PW[normalizePriority(b.priority)] - PW[normalizePriority(a.priority)] || byTime(a, b));
  return c.sort(byTime);
}
const toISODate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function addDays(iso, delta) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() + delta); return toISODate(dt); }
function formatDayLong(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const s = new Date(y, m - 1, d).toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function formatHour(t) {
  const [h = 0, m = 0] = t.split(":").map(Number);
  return `${h % 12 === 0 ? 12 : h % 12}:${String(m).padStart(2, "0")} ${h < 12 ? "a. m." : "p. m."}`;
}
/* Selector de hora con reloj (12 h, a. m. / p. m.): se ve igual en cualquier teléfono */

const ICON_CLOCK = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

/* ----- Repetición de actividades -----
   repeat: "none" (una sola vez) | "daily" (todos los días) | "weekly" (el mismo día de la semana).
   `day` es el día en que EMPIEZA la serie. Campos extra de una serie repetida:
   done_dates (días en que se marcó hecha), bought_dates (compras marcadas por día),
   skip (días eliminados solo ese día) y until (último día, si se borró "este y los siguientes"). */
const WD_SING = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const WD_PLUR = ["domingos", "lunes", "martes", "miércoles", "jueves", "viernes", "sábados"];
const REPEATS = ["none", "daily", "weekly"];
const normalizeRepeat = v => REPEATS.includes(v) ? v : "none";
const isRepeating = a => normalizeRepeat(a && a.repeat) !== "none";
const weekdayOf = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).getDay(); };
function repeatLabel(repeat, day) {
  if (repeat === "daily") return "Todos los días";
  if (repeat === "weekly") return `Todos los ${WD_PLUR[weekdayOf(day)]}`;
  return "No se repite";
}
function occursOn(a, day) {
  const rep = normalizeRepeat(a.repeat);
  if (rep === "none") return a.day === day;
  if (day < a.day) return false;                       // las fechas ISO se comparan como texto
  if (a.until && day > a.until) return false;
  if (a.skip && a.skip.includes(day)) return false;
  return rep === "daily" || weekdayOf(day) === weekdayOf(a.day);
}

/* =========================================================================
   Capa de datos — hoy usa localStorage.
   Para conectar tu backend (Supabase, etc.) reemplaza SOLO estas funciones
   (list / upcoming / save / setDone / toggleItem / remove / removeOccurrence)
   manteniendo la misma forma de datos.
   ========================================================================= */
const Store = {
  KEY: "mi-dia:activities:v1",
  _all() { try { return JSON.parse(localStorage.getItem(this.KEY) || "[]"); } catch { return []; } },
  _write(a) { try { localStorage.setItem(this.KEY, JSON.stringify(a)); } catch (e) { toast("No se pudo guardar en el navegador."); return; } try { Notif.syncSoon(); } catch {} },
  // Una actividad repetida se muestra como una "ocurrencia" de ese día (done y compras propios de ese día).
  _view(a, day) {
    if (!isRepeating(a)) return a;
    const bought = (a.bought_dates && a.bought_dates[day]) || [];
    return { ...a, day, base_day: a.day, done: (a.done_dates || []).includes(day),
      shopping: (a.shopping || []).map(i => ({ ...i, bought: bought.includes(i.id) })) };
  },
  list(day) { return this._all().filter(a => occursOn(a, day)).map(a => this._view(a, day)); },
  upcoming(fromDay, days) {
    const all = this._all(), out = [];
    for (let i = 0; i <= days; i++) { const d = addDays(fromDay, i); for (const a of all) if (occursOn(a, d)) out.push(this._view(a, d)); }
    return out;
  },
  save(draft, id) {
    const all = this._all(), now = new Date().toISOString();
    if (id) {
      const i = all.findIndex(a => a.id === id);
      if (i >= 0) {
        const prev = all[i], next = { ...prev, ...draft, updated_at: now };
        const was = isRepeating(prev), is = isRepeating(draft);
        if (!was && is) { next.done_dates = prev.done ? [prev.day] : []; next.done = false; }
        if (was && !is) { next.done = (prev.done_dates || []).includes(draft.day); delete next.done_dates; delete next.bought_dates; delete next.skip; delete next.until; }
        all[i] = next;
      }
    } else all.push({ id: uid(), done: false, created_at: now, updated_at: now, ...draft });
    this._write(all);
  },
  patch(id, p) { const all = this._all(), i = all.findIndex(a => a.id === id); if (i >= 0) { all[i] = { ...all[i], ...p, updated_at: new Date().toISOString() }; this._write(all); } },
  setDone(id, day, val) {
    const all = this._all(), a = all.find(x => x.id === id); if (!a) return;
    if (!isRepeating(a)) a.done = val;
    else { const s = new Set(a.done_dates || []); if (val) s.add(day); else s.delete(day); a.done_dates = [...s].sort().slice(-400); }
    a.updated_at = new Date().toISOString(); this._write(all);
  },
  toggleItem(id, day, itemId) {
    const all = this._all(), a = all.find(x => x.id === id); if (!a) return;
    if (!isRepeating(a)) a.shopping = (a.shopping || []).map(i => i.id === itemId ? { ...i, bought: !i.bought } : i);
    else {
      const bd = a.bought_dates || (a.bought_dates = {}), s = new Set(bd[day] || []);
      if (s.has(itemId)) s.delete(itemId); else s.add(itemId);
      bd[day] = [...s];
      Object.keys(bd).sort().slice(0, -60).forEach(k => delete bd[k]);   // guarda solo los últimos 60 días
    }
    a.updated_at = new Date().toISOString(); this._write(all);
  },
  remove(id) { this._write(this._all().filter(a => a.id !== id)); },
  // scope: "one" (solo ese día) | "following" (ese día y los siguientes) | "all" (toda la serie)
  removeOccurrence(id, day, scope) {
    const all = this._all(), i = all.findIndex(a => a.id === id); if (i < 0) return;
    const a = all[i];
    if (scope === "all" || !isRepeating(a)) all.splice(i, 1);
    else if (scope === "following") { const until = addDays(day, -1); if (until < a.day) all.splice(i, 1); else a.until = until; }
    else a.skip = [...(a.skip || []), day];
    this._write(all);
  },
};

/* =========================================================================
   Avisos: te recuerda antes de que empiece cada actividad.
   - Notificación del sistema (si das permiso) + aviso dentro de la app + sonido.
   - Funciona mientras la app esté abierta (aunque esté en segundo plano).
   ========================================================================= */
const Notif = {
  KEY: "mi-dia:notif:v1",
  cfg: { enabled: false, lead: 10, sound: true },
  fired: new Set(),
  load() {
    try { Object.assign(this.cfg, JSON.parse(localStorage.getItem(this.KEY) || "{}")); } catch {}
    try { this.fired = new Set(JSON.parse(localStorage.getItem(this.KEY + ":fired") || "[]")); } catch {}
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.cfg)); } catch {} },
  saveFired() { try { localStorage.setItem(this.KEY + ":fired", JSON.stringify([...this.fired].slice(-300))); } catch {} },
  supported: () => "Notification" in window,
  perm() { return this.native() ? this.nativePerm : (this.supported() ? Notification.permission : "unsupported"); },
  async enable() {
    if (this.native()) { this.cfg.enabled = true; this.save(); await this.enableNative(); this.paintBell(); return; }
    if (this.supported() && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch {}
    }
    this.cfg.enabled = true; this.save(); this.paintBell();
    await this.subscribePush();
  },
  async disable() {
    this.cfg.enabled = false; this.save();
    await this.unsubscribePush(); this.paintBell();
  },
  paintBell() {
    document.querySelectorAll("[data-bell]").forEach(b => { b.classList.toggle("on", this.cfg.enabled); b.classList.toggle("off", !this.cfg.enabled); b.innerHTML = this.cfg.enabled ? ICON.bell : ICON.bellOff; });
  },
  beep() {
    if (!this.cfg.sound) return;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22].forEach((d, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = i ? 988 : 784; o.connect(g); g.connect(ac.destination);
        const t0 = ac.currentTime + d; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
        o.start(t0); o.stop(t0 + 0.32);
      });
      setTimeout(() => ac.close(), 800);
    } catch {}
  },
  fire(a, minsLeft, test) {
    const when = minsLeft <= 0 ? "¡Empieza ahora!" : `Empieza en ${minsLeft} min · ${formatHour(a.start_time)}`;
    if (this.native()) { if (test) this.testNative(a, when); }
    else if (this.perm() === "granted") {
      const opts = { body: when, tag: a.id, icon: "icon-192.png" };
      if (this.swReg) this.swReg.showNotification(a.title, opts).catch(() => {});
      else { try { new Notification(a.title, opts); } catch {} }
    }
    this.banner(a, when); this.beep();
    if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch {}
  },
  banner(a, when) {
    const el = document.createElement("div"); el.className = "alert"; el.setAttribute("role", "alert");
    el.innerHTML = `<span aria-hidden="true" style="font-size:22px">⏰</span><div class="tx"><b>${esc(a.title)}</b><small>${esc(when)}</small></div><button type="button">Listo</button>`;
    el.querySelector("button").onclick = () => el.remove();
    $("#alerts").appendChild(el); setTimeout(() => el.remove(), 30000);
  },
  tick() {
    if (!this.cfg.enabled) return;
    const now = new Date(), day = toISODate(now), nowMin = now.getHours() * 60 + now.getMinutes();
    let changed = false;
    for (const a of Store.list(day)) {
      if (a.done) continue;
      const start = timeToMinutes(a.start_time), lead = this.cfg.lead;
      const key = `${a.id}|${day}|${a.start_time}|${lead}`;
      // ventana: desde (inicio - antelación) hasta 2 min después del inicio
      if (nowMin >= start - lead && nowMin <= start + 2 && !this.fired.has(key)) {
        this.fired.add(key); changed = true; this.fire(a, Math.max(0, start - nowMin));
      }
    }
    if (changed) this.saveFired();
  },
};

function statusNote(c) {
  if (!c.enabled) return "";

  }
  if (Notif.push === "on") return `<p class="note">✓ Avisos con la app <b>cerrada</b> activos en este dispositivo.</p>`;
  const wv = /; wv\)/.test(navigator.userAgent);
  return `<p class="note warn">${wv ? "Esta versión de la app (APK simple) no puede avisar con la app cerrada." : "Avisos con la app cerrada no disponibles" + why + "."} Seguirás recibiendo avisos mientras Mi Día esté abierto.</p>`;
}

    layer.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="n-t">
      <h2 id="n-t">Avisos</h2><p class="sub">Te aviso antes de que empiece cada actividad pendiente.</p>
      <form style="gap:18px" onsubmit="return false">
        <label class="switch-row">Activar avisos<input type="checkbox" class="switch" id="n-on" ${c.enabled ? "checked" : ""}></label>
        <div class="field"><span class="lbl">Avisarme</span><div class="lead-pick">
          ${LEADS.map(([m, l]) => `<button type="button" class="sel" data-lead="${m}" aria-pressed="${c.lead === m}" style="--c:var(--primary)">${l}${m ? " antes" : ""}</button>`).join("")}</div></div>
        <label class="switch-row">Sonido<input type="checkbox" class="switch" id="n-snd" ${c.sound ? "checked" : ""}></label>
        ${p === "denied" ? `<p class="note warn">Las notificaciones del sistema están bloqueadas en este navegador. Verás el aviso dentro de la app; para recibirlas fuera, permítelas en la configuración del sitio.</p>`
          : p === "unsupported" ? `<p class="note warn">Este navegador no soporta notificaciones del sistema. Verás el aviso dentro de la app.</p>`
          : p === "default" ? `<p class="note">Al activar, el navegador te pedirá permiso para mostrar notificaciones.</p>` : `<p class="note">✓ Notificaciones del sistema permitidas.</p>`}
        ${statusNote(c)}
        <div class="actions"><button type="button" class="btn outline" id="n-test" style="flex:1">Probar aviso</button><button type="button" class="btn sun" id="n-ok">Listo</button></div>
      </form></div></div>`;
    $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") close(); });
    $("#n-ok").onclick = close;
    $("#n-on").onchange = async e => { if (e.target.checked) await Notif.enable(); else await Notif.disable(); draw(); };
    $("#n-snd").onchange = e => { c.sound = e.target.checked; Notif.save(); if (c.sound) Notif.beep(); };
    $("#n-test").onclick = async () => {
      if (Notif.supported() && Notification.permission === "default") { try { await Notification.requestPermission(); } catch {} draw(); }
      Notif.fire({ id: "test", title: "Así se verá tu aviso", start_time: "09:00" }, Math.max(c.lead, 0), true);
    };
    layer.querySelectorAll("[data-lead]").forEach(b => b.onclick = () => { c.lead = +b.dataset.lead; Notif.save(); Notif.sync(); draw(); });
  };
  document.addEventListener("keydown", onKey); draw();
}
document.querySelectorAll("[data-bell]").forEach(b => b.addEventListener("click", openNotifSheet));

/* ----- Push (avisos con la app cerrada): service worker + servidor server.js ----- */
Object.assign(Notif, {
  push: "off", reason: "", swReg: null, sub: null, _t: null,
  canPush() { return "serviceWorker" in navigator && "PushManager" in window && /^https?:$/.test(location.protocol); },
  async initSW() {
    if (this.native()) return this.initNative();
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) { if (this.cfg.enabled) { this.reason = "ábrela desde el servidor (http://localhost:3000 o tu https)"; this.push = "unavailable"; } return; }
    try {
      this.swReg = await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      if (this.cfg.enabled && this.perm() === "granted") await this.subscribePush();
    } catch (e) { this.push = "unavailable"; this.reason = "no se pudo iniciar el service worker"; }
  },
  async subscribePush() {
    try {
      if (!this.canPush()) throw new Error("este navegador o la forma de abrir la app no permite push (usa http://localhost o https)");
      if (this.perm() !== "granted") throw new Error("falta el permiso de notificaciones del navegador");
      const reg = this.swReg || await navigator.serviceWorker.ready;
      const r = await fetch("api/vapid-public-key", { cache: "no-store" });
      if (!r.ok) throw new Error("no se encontró el servidor de avisos");
      const { key } = await r.json(), keyBytes = b64ToU8(key);
      let sub = await reg.pushManager.getSubscription();
      if (sub && !sameKey(sub.options && sub.options.applicationServerKey, keyBytes)) { await sub.unsubscribe(); sub = null; }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes });
      this.sub = sub; this.push = "on"; this.reason = "";
      await this.sync();
    } catch (e) { this.push = "unavailable"; this.reason = e && e.message ? e.message : String(e); }
  },
  async unsubscribePush() {
    if (this.native()) { await this.cancelNative(); this.push = "off"; this.reason = ""; return; }
    try {
      const reg = this.swReg || (this.canPush() ? await navigator.serviceWorker.ready : null);
      const sub = this.sub || (reg && await reg.pushManager.getSubscription());
      if (sub) { fetch("api/unsubscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); }
    } catch {}
    this.sub = null; this.push = "off"; this.reason = "";
  },
  syncSoon() { clearTimeout(this._t); this._t = setTimeout(() => this.sync(), 800); },
  buildReminders() {
    const now = Date.now(), lead = this.cfg.lead, reminders = [];
    for (const a of Store.upcoming(today(), 31)) {   // incluye cada repetición de los próximos días
      if (a.done) continue;
      const [y, m, d] = a.day.split("-").map(Number), [h, mi] = a.start_time.split(":").map(Number);
      const start = new Date(y, m - 1, d, h, mi).getTime(), at = start - lead * 60000, expires = start + 2 * 60000;
      if (expires < now || at > now + 30 * 86400000) continue;
      reminders.push({ id: `${a.id}|${a.day}|${a.start_time}|${lead}`, tag: a.id, title: a.title, at, expires,
        body: lead > 0 ? `Empieza en ${lead} min · ${formatHour(a.start_time)}` : "¡Empieza ahora!" });
    }
    return reminders;
  },
  async sync() {
    if (this.native()) return this.queueNative();
    if (this.push !== "on" || !this.sub || !this.cfg.enabled) return;
    const reminders = this.buildReminders();
    try {
      const r = await fetch("api/sync", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subscription: this.sub.toJSON(), reminders: reminders.slice(0, 500) }) });
      if (!r.ok) throw new Error("el servidor rechazó la sincronización");
    } catch (e) { this.reason = "sin conexión con el servidor de avisos"; }
  },
});

/* ----- Avisos nativos (APK hecho con Capacitor): se programan en el teléfono, sin servidor ----- */
Object.assign(Notif, {
  nativePerm: "default", _q: null,
  native() { try { return !!(window.Capacitor && typeof Capacitor.isNativePlatform === "function" && Capacitor.isNativePlatform() && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications); } catch { return false; } },
  LN() { return window.Capacitor.Plugins.LocalNotifications; },
  async channel() {
    try { await this.LN().createChannel({ id: "actividades", name: "Avisos de actividades", description: "Te avisa antes de que empiece cada actividad", importance: 5, visibility: 1, vibration: true }); } catch {}
  },
  async initNative() {
    try {
      const r = await this.LN().checkPermissions();
      this.nativePerm = r.display === "granted" ? "granted" : r.display === "denied" ? "denied" : "default";
      if (this.cfg.enabled && this.nativePerm === "granted") { await this.channel(); this.push = "on"; await this.scheduleNative(); }
    } catch (e) { this.push = "unavailable"; this.reason = "no se pudo iniciar los avisos del teléfono"; }
  },
  async enableNative() {
    try {
      const r = await this.LN().requestPermissions();
      this.nativePerm = r.display === "granted" ? "granted" : "denied";
      if (this.nativePerm !== "granted") { this.push = "unavailable"; this.reason = "falta el permiso de notificaciones"; return; }
      await this.channel();
      try { const ex = await this.LN().checkExactNotificationSetting(); if (ex && ex.exact_alarm && ex.exact_alarm !== "granted") await this.LN().changeExactNotificationSetting(); } catch {}
      this.push = "on"; this.reason = "";
      await this.scheduleNative();
    } catch (e) { this.push = "unavailable"; this.reason = "no se pudo activar"; }
  },
  async cancelNative() {
    try { const p = await this.LN().getPending(); if (p.notifications.length) await this.LN().cancel({ notifications: p.notifications.map(n => ({ id: n.id })) }); } catch {}
  },
  queueNative() { this._q = (this._q || Promise.resolve()).then(() => this.scheduleNative()).catch(() => {}); return this._q; },
  async scheduleNative() {
    await this.cancelNative();
    if (!this.cfg.enabled || this.nativePerm !== "granted") return;
    const now = Date.now();
    const list = this.buildReminders().filter(r => r.at > now).sort((a, b) => a.at - b.at).slice(0, 200).map(r => ({
      id: hashId(r.id), title: r.title, body: r.body, channelId: "actividades", extra: { tag: r.tag },
      schedule: { at: new Date(r.at), allowWhileIdle: true } }));
    if (list.length) await this.LN().schedule({ notifications: list });
  },
  async testNative(a, body) {
    await this.channel();
    try { await this.LN().schedule({ notifications: [{ id: hashId("test" + Date.now()), title: a.title, body, channelId: "actividades", schedule: { at: new Date(Date.now() + 700) } }] }); } catch {}
  },
});
function hashId(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) % 2147483647 || 1; }
function b64ToU8(s) { const p = "=".repeat((4 - (s.length % 4)) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
function sameKey(buf, u8) { if (!buf) return false; const a = new Uint8Array(buf); return a.length === u8.length && a.every((v, i) => v === u8[i]); }

const checkSky = () => { const h = document.querySelector(".hero"); if (h && h.dataset.sky !== skyOf()) render(); };
setInterval(checkSky, 60000); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkSky(); });
Notif.load(); Notif.paintBell(); Notif.tick(); Notif.initSW();
setInterval(() => Notif.tick(), 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) Notif.tick(); });

render();
setInterval(() => { if (!$("#layer").children.length) render(); }, 60000); // mueve el marcador de "ahora"
</script>
<script>
(function () {
  var sp = document.getElementById("splash"); if (!sp) return;
  var t0 = Date.now(), done = false;
  function hide() {
    if (done) return; done = true;
    setTimeout(function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 500); }, Math.max(0, 2400 - (Date.now() - t0)));
  }
  if (document.readyState === "complete") hide(); else addEventListener("load", hide);
  setTimeout(hide, 4000);
})();
</script>
